<style>
/* ============================================================
   styles.css - premium Gen Z study planner
   ============================================================ */
:root {
  --bg: #f6f5fc;
  --bg-grad: radial-gradient(1200px 600px at 85% -10%, #ede9fe 0%, transparent 60%),
             radial-gradient(1000px 500px at -10% 15%, #fae8ff 0%, transparent 55%),
             #f6f5fc;
  --card: #ffffff;
  --card-2: #faf9ff;
  --ink: #191431;
  --ink-2: #6b6885;
  --ink-3: #9c98b5;
  --line: #eceaf6;
  --line-2: #f2f0fa;
  --brand: #6c5ce7;
  --brand-2: #a855f7;
  --accent: #ec4899;
  --grad: linear-gradient(120deg, #6c5ce7 0%, #a855f7 52%, #ec4899 100%);
  --ok: #10b981;
  --ok-bg: #e7f9f1;
  --warn: #f59e0b;
  --warn-bg: #fef3e0;
  --bad: #ef4444;
  --bad-bg: #fdeaea;
  --shadow: 0 1px 2px rgba(25, 20, 49, .04), 0 12px 30px -12px rgba(25, 20, 49, .12);
  --shadow-lg: 0 4px 10px rgba(25, 20, 49, .05), 0 24px 50px -18px rgba(108, 92, 231, .25);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.22, .8, .36, 1);
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 12px;
  font-size: 16px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg-grad);
  background-attachment: fixed;
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
body.setup-mode { padding-bottom: 0; }

button { font-family: inherit; cursor: pointer; }
input, select {
  font-family: inherit;
  font-size: .95rem;
  color: var(--ink);
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #d9d5ec; border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }
::selection { background: #e5e0ff; }

/* ---------------- app shell ---------------- */
.app-shell { max-width: 1160px; margin: 0 auto; padding: 0 20px 120px; }

/* ---------------- topbar ---------------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 14px 0;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(246, 245, 252, .78);
  border-bottom: 1px solid rgba(236, 234, 246, .6);
}
.brand {
  display: inline-flex; align-items: center; gap: 11px;
  background: none; border: 0; padding: 4px 2px;
  font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink);
  text-align: left;
}
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--grad);
  color: #fff; display: grid; place-items: center; flex-shrink: 0;
  box-shadow: 0 6px 16px -6px rgba(168, 85, 247, .6);
  transition: transform .35s var(--spring);
}
.brand:hover .brand-mark { transform: rotate(-8deg) scale(1.06); }
.brand-mark svg { width: 21px; height: 21px; }
.brand-inner { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.12; }
.brand-name { font-size: 1.16rem; font-weight: 800; letter-spacing: -.02em; color: var(--ink); }
.brand-hindi {
  font-size: .84rem; font-weight: 700; margin-left: 5px;
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.brand-by { font-size: .6rem; font-weight: 700; color: var(--ink-3); letter-spacing: .03em; margin-top: 1px; }
.grad {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.topnav { display: flex; gap: 4px; margin-left: 8px; }
.topnav button {
  background: none; border: 0; color: var(--ink-2);
  font-weight: 600; font-size: .92rem; padding: 9px 14px; border-radius: 99px;
  transition: all .22s var(--ease);
}
.topnav button:hover { color: var(--ink); background: rgba(255,255,255,.7); }
.topnav button.active { background: #fff; color: var(--brand); box-shadow: var(--shadow); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }

.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line);
  background: #fff; color: var(--ink-2);
  display: grid; place-items: center;
  transition: all .2s var(--ease);
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:hover { color: var(--brand); transform: translateY(-1px); box-shadow: var(--shadow); }
.icon-btn:active { transform: scale(.94); }
.icon-btn.danger:hover { color: var(--bad); border-color: #f6cdcd; }

/* ---------------- bottom nav ---------------- */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: none;
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  justify-content: space-around;
}
.bn-item {
  background: none; border: 0; color: var(--ink-3);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: .68rem; font-weight: 600;
  padding: 4px 10px; border-radius: 14px;
  transition: color .2s var(--ease);
}
.bn-ic { display: grid; place-items: center; width: 34px; height: 26px; position: relative; }
.bn-ic svg { width: 22px; height: 22px; }
.bn-item.active { color: var(--brand); }
.bn-item.active .bn-ic {
  transform: translateY(-2px);
}
.bn-item.active .bn-ic::after {
  content: ''; position: absolute; inset: -2px 4px; border-radius: 12px;
  background: rgba(108, 92, 231, .12);
  animation: bnPulse .4s var(--spring);
}
@keyframes bnPulse { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ---------------- page ---------------- */
.view { animation: fadeIn .35s var(--ease); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.page { padding: 34px 0 10px; }
.page.narrow { max-width: 900px; margin: 0 auto; }
.page-head { margin-bottom: 26px; }
.page-head.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.eyebrow {
  margin: 0 0 8px; font-size: .72rem; font-weight: 800;
  letter-spacing: .14em; text-transform: uppercase; color: var(--brand-2);
}
.h-xl {
  margin: 0; font-size: clamp(1.9rem, 4.6vw, 3rem);
  font-weight: 800; letter-spacing: -.035em; line-height: 1.08;
}
.sub { margin: 10px 0 0; color: var(--ink-2); font-size: 1.02rem; max-width: 60ch; }
.byline { display: block; margin-top: 10px; font-size: .82rem; color: var(--ink-3); font-weight: 600; }
.byline a { color: var(--brand); font-weight: 700; text-decoration: none; }
.byline a:hover { text-decoration: underline; }

/* ---------------- cards ---------------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow);
  padding: 22px;
}
.card-label { margin: 0 0 12px; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.empty {
  text-align: center; padding: 44px 22px; color: var(--ink-2);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.empty p { margin: 0; font-weight: 700; color: var(--ink); }
.empty small { color: var(--ink-3); }
.empty.sm { padding: 18px; }
.empty-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: #f0edff; color: var(--brand); }
.empty-ic svg { width: 26px; height: 26px; }

/* ---------------- reveal animation ---------------- */
.reveal { opacity: 0; transform: translateY(14px); }
.reveal.in { opacity: 1; transform: none; transition: opacity .5s var(--ease), transform .55s var(--spring); }

/* ---------------- buttons ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px;
  font-weight: 700; font-size: .95rem;
  padding: 13px 22px;
  transition: transform .18s var(--spring), box-shadow .2s var(--ease), background .2s var(--ease);
  user-select: none;
}
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: scale(.96); }
.btn.primary {
  color: #fff;
  background: var(--grad);
  background-size: 150% 150%;
  box-shadow: 0 10px 24px -10px rgba(168, 85, 247, .65);
}
.btn.primary:hover { transform: translateY(-2px); box-shadow: 0 16px 30px -12px rgba(168, 85, 247, .7); background-position: 100% 50%; }
.btn.primary:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; transform: none; }
.btn.ghost { background: var(--card); border: 1.5px solid var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }
.btn.wide { width: 100%; }
.btn.sm { padding: 9px 14px; font-size: .85rem; }
.btn.add-module { width: 100%; border-style: dashed; }

/* ---------------- chips ---------------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn {
  border: 1.5px solid var(--line); background: #fff; color: var(--ink-2);
  border-radius: 99px; padding: 8px 15px; font-weight: 600; font-size: .86rem;
  transition: all .2s var(--spring);
}
.chip-btn:hover { border-color: var(--brand-2); color: var(--brand); transform: translateY(-1px); }
.chip-btn.on {
  border-color: transparent; color: #fff;
  background: var(--grad); box-shadow: 0 6px 14px -6px rgba(168, 85, 247, .6);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .72rem; font-weight: 800; letter-spacing: .03em;
  padding: 5px 10px; border-radius: 99px; text-transform: capitalize;
  background: var(--line-2); color: var(--ink-2);
}
.chip-hi { background: var(--bad-bg); color: var(--bad); }
.chip-mid { background: var(--warn-bg); color: #b45309; }
.chip-lo { background: var(--ok-bg); color: #047857; }
.chip-ok { background: var(--ok-bg); color: #047857; }

/* ---------------- forms ---------------- */
.field { margin-bottom: 16px; }
.field label { display: block; font-weight: 700; font-size: .82rem; margin-bottom: 7px; color: var(--ink-2); }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.field.mini label { font-size: .76rem; }
input[type="date"], input[type="number"], input[type="text"], select {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: #fff;
  outline: none;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  appearance: none;
  -webkit-appearance: none;
}
input:focus, select:focus {
  border-color: var(--brand-2);
  box-shadow: 0 0 0 4px rgba(168, 85, 247, .14);
}
.hint { display: block; margin-top: 6px; font-size: .78rem; color: var(--ink-3); }
.stepper { display: flex; align-items: center; gap: 10px; }
.step-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line);
  background: #fff; font-size: 1.2rem; font-weight: 700; color: var(--ink);
  transition: all .18s var(--spring);
}
.step-btn:hover { border-color: var(--brand-2); color: var(--brand); transform: translateY(-1px); }
.step-btn:active { transform: scale(.92); }
.step-val { min-width: 34px; text-align: center; font-weight: 800; font-size: 1.1rem; }

/* ---------------- wizard ---------------- */
.wiz-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: start; }
.wiz-side { position: sticky; top: 84px; }
.live-card { background: linear-gradient(160deg, #fdfbff, #f4f0ff); border: 1px solid #e6e0ff; }
.live-row {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 11px 0; border-bottom: 1px dashed #ddd6f8;
  font-size: .9rem; color: var(--ink-2);
}
.live-row strong { color: var(--ink); font-weight: 800; }
.live-row.live-hot strong { font-size: 1.25rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.live-verdict { margin: 14px 0; }
.live-card .btn { margin-top: 8px; }
.live-card .btn + .btn { margin-top: 0; }
.module-editor { background: var(--card-2); }
.me-head { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.me-name { flex: 1; font-weight: 700; }
.ch-row { display: grid; grid-template-columns: 1.5fr .7fr .6fr .7fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
.ch-sel { padding: 9px 10px; font-size: .84rem; }
.ch-hours { padding: 9px 10px; }
.ch-name { font-size: .9rem; }
.module-editor .btn.sm { margin-top: 6px; }
.module-editor.flash { animation: flashRing 1.2s var(--ease); }
@keyframes flashRing { 0%,100% { box-shadow: none; } 40% { box-shadow: 0 0 0 5px rgba(168,85,247,.25); } }

/* ---------------- status tag ---------------- */
.status-tag {
  display: inline-flex; align-items: center; gap: 12px;
  border-radius: 16px; padding: 12px 16px;
  border: 1px solid; font-size: .86rem;
  background: #fff;
}
.status-tag.big { padding: 18px 22px; border-radius: 20px; }
.status-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
.status-ic svg { width: 20px; height: 20px; }
.status-txt { display: flex; flex-direction: column; }
.status-txt strong { font-size: .95rem; }
.status-txt small { color: var(--ink-2); margin-top: 1px; }
.st-ok { border-color: #c9f2e2; background: linear-gradient(160deg,#fff,#f1fbf7); }
.st-ok .status-ic { background: var(--ok-bg); color: var(--ok); }
.st-warn { border-color: #fbe3b8; background: linear-gradient(160deg,#fff,#fffaf0); }
.st-warn .status-ic { background: var(--warn-bg); color: #d97706; }
.st-bad { border-color: #f6cdcd; background: linear-gradient(160deg,#fff,#fff5f5); }
.st-bad .status-ic { background: var(--bad-bg); color: var(--bad); }

/* ---------------- stat cards ---------------- */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
.stat-grid.small { grid-template-columns: repeat(3, 1fr); }
.stat-card { position: relative; overflow: hidden; }
.stat-card.grad-bg { background: var(--grad); border: 0; color: #fff; }
.stat-card.grad-bg .stat-label, .stat-card.grad-bg .stat-sub, .stat-card.grad-bg .stat-unit { color: rgba(255,255,255,.85); }
.stat-ic { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: rgba(108,92,231,.1); color: var(--brand); }
.stat-card.grad-bg .stat-ic { background: rgba(255,255,255,.18); color: #fff; }
.stat-ic svg { width: 19px; height: 19px; }
.stat-num { font-size: 2.1rem; font-weight: 800; letter-spacing: -.03em; line-height: 1; margin-top: 6px; }
.stat-num .count { font-variant-numeric: tabular-nums; }
.stat-unit { font-size: 1rem; font-weight: 700; margin-left: 3px; color: var(--ink-2); }
.stat-label { margin: 8px 0 0; font-weight: 700; font-size: .9rem; }
.stat-sub { margin: 2px 0 0; font-size: .8rem; color: var(--ink-3); }

/* ---------------- bars ---------------- */
.bar { height: 10px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.bar-fill {
  height: 100%; width: 0; border-radius: 99px;
  background: var(--brand);
  transition: width .9s var(--spring);
}
.bar-fill.fill-violet { background: linear-gradient(90deg, #6c5ce7, #a855f7); }
.bar-fill.fill-ok { background: linear-gradient(90deg, #10b981, #34d399); }
.bar-fill.fill-amber { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.bar-fill.fill-pink { background: linear-gradient(90deg, #ec4899, #f472b6); }

.prog-list { display: flex; flex-direction: column; gap: 16px; }
.prog-row { display: flex; flex-direction: column; gap: 7px; }
.prog-meta { display: flex; justify-content: space-between; font-size: .9rem; }
.prog-meta strong { font-variant-numeric: tabular-nums; }

/* ---------------- banner ---------------- */
.banner {
  display: flex; align-items: center; gap: 16px;
  background: linear-gradient(120deg, #fff7f0, #fff);
  border-color: #f8e2cd;
  margin-bottom: 20px;
}
.banner-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--warn-bg); color: #d97706; display: grid; place-items: center; flex-shrink: 0; }
.banner-ic svg { width: 22px; height: 22px; }
.banner-txt { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.banner-txt strong { font-size: .98rem; }
.banner-txt span { color: var(--ink-2); font-size: .86rem; }
.banner .btn { flex-shrink: 0; }

/* ---------------- dashboard ---------------- */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.today-preview { cursor: pointer; transition: transform .25s var(--spring), box-shadow .25s var(--ease); }
.today-preview:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.arrow-pill {
  width: 36px; height: 36px; border-radius: 99px; background: var(--line-2);
  display: grid; place-items: center; color: var(--brand);
  transition: transform .3s var(--spring), background .2s;
}
.today-preview:hover .arrow-pill { transform: translateX(4px); background: var(--brand); color: #fff; }
.arrow-pill svg { width: 18px; height: 18px; }
.today-time { font-size: 2.2rem; font-weight: 800; letter-spacing: -.03em; margin: 4px 0 14px; }
.today-sub { margin: 10px 0 0; color: var(--ink-3); font-size: .86rem; }
.week-nums { display: flex; gap: 22px; margin-bottom: 16px; }
.wn { display: flex; flex-direction: column; }
.wn strong { font-size: 1.3rem; font-weight: 800; }
.wn small { color: var(--ink-3); font-size: .74rem; }
.week-sub { margin: 10px 0 0; color: var(--ink-3); font-size: .86rem; }

/* ---------------- today ---------------- */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; padding: 16px; }
.ws-day {
  border-radius: 14px; padding: 10px 6px; text-align: center;
  display: flex; flex-direction: column; gap: 3px;
  background: var(--line-2); border: 1.5px solid transparent;
  transition: all .25s var(--spring);
}
.ws-day.today { background: #fff; border-color: var(--brand); box-shadow: 0 8px 20px -8px rgba(108,92,231,.45); transform: translateY(-2px); }
.ws-day.off { opacity: .5; }
.ws-wd { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.ws-date { font-size: .72rem; color: var(--ink-3); }
.ws-mins { font-weight: 800; font-size: .82rem; margin-top: 2px; }
.ws-bar { height: 4px; border-radius: 99px; background: #e6e2f5; margin-top: 4px; overflow: hidden; }
.ws-fill { height: 100%; background: var(--grad); border-radius: 99px; transition: width .6s var(--spring); }
.today-layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
.today-summary { display: flex; align-items: center; gap: 20px; margin-bottom: 12px; }
.ts-big { display: flex; align-items: baseline; gap: 4px; font-size: 2.4rem; font-weight: 800; letter-spacing: -.03em; }
.ts-big small { font-size: .95rem; color: var(--ink-3); font-weight: 700; }
.ts-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.ts-info strong { font-size: .98rem; }
.ts-info span { color: var(--ink-3); font-size: .84rem; }

.task {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 16px; margin-bottom: 10px;
  background: #fff; border: 1.5px solid var(--line); border-radius: 18px;
  cursor: pointer;
  transition: transform .22s var(--spring), border-color .22s var(--ease), box-shadow .22s var(--ease), opacity .3s;
}
.task:hover { transform: translateX(4px); border-color: #dcd6f7; box-shadow: var(--shadow); }
.task-check {
  width: 26px; height: 26px; border-radius: 9px; border: 2px solid var(--line);
  display: grid; place-items: center; color: #fff; flex-shrink: 0;
  transition: all .25s var(--spring);
  background: transparent;
}
.task-check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: all .2s var(--spring); }
.task.done { opacity: .6; }
.task.done .task-check { background: var(--grad); border-color: transparent; }
.task.done .task-check svg { opacity: 1; transform: scale(1); }
.task.done .task-title { text-decoration: line-through; }
.task.pop .task-check { animation: popBounce .45s var(--spring); }
@keyframes popBounce { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(6deg); } 100% { transform: scale(1); } }
.task-body { flex: 1; min-width: 0; }
.task-title { margin: 0; font-weight: 700; font-size: .95rem; }
.task-meta { margin: 3px 0 0; font-size: .8rem; color: var(--ink-3); }
.tag { color: var(--brand); font-weight: 600; }
.task-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.task-mins { font-size: .82rem; font-weight: 800; color: var(--ink-2); }
.done-block { margin-top: 18px; }
.done-label { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.tip-card { position: sticky; top: 84px; }
.tip-list { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); font-size: .88rem; }

/* ---------------- plan ---------------- */
.status-hero { margin-bottom: 20px; }
.balance-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
.balance-big { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; margin: 4px 0; }
.grad-num { background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.grad-num-ok { color: var(--ok); }
.balance-sub { color: var(--ink-3); font-size: .82rem; margin: 0; }
.balance-mini { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.bm-row { display: flex; justify-content: space-between; font-size: .86rem; color: var(--ink-2); }
.bm-row strong { color: var(--ink); }
.capacity-row { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 12px; }
.cap-label { display: flex; justify-content: space-between; font-size: .86rem; color: var(--ink-2); }
.cap-label strong { color: var(--ink); }
.phase-list { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.phase-card { display: flex; justify-content: space-between; gap: 18px; align-items: center; transition: transform .22s var(--spring), box-shadow .25s var(--ease); }
.phase-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.phase-left { display: flex; gap: 16px; align-items: flex-start; }
.phase-dot {
  width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
  display: grid; place-items: center;
  font-weight: 800; font-size: 1.05rem; color: #fff;
  background: var(--grad); box-shadow: 0 8px 18px -8px rgba(168,85,247,.6);
}
.phase-name { margin: 0; font-weight: 800; font-size: 1.02rem; }
.phase-sub { margin: 2px 0 0; color: var(--ink-3); font-size: .82rem; }
.phase-desc { margin: 8px 0 0; color: var(--ink-2); font-size: .88rem; max-width: 52ch; }
.phase-right { min-width: 180px; }
.phase-pct { font-weight: 800; font-size: 1.05rem; margin-bottom: 8px; text-align: right; }

/* ---------------- syllabus ---------------- */
.syl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.module-card { transition: transform .22s var(--spring), box-shadow .25s var(--ease); }
.module-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.mc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mc-name { font-weight: 800; font-size: 1.02rem; }
.mc-actions { display: flex; gap: 6px; }
.mc-stats { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--ink-3); font-size: .82rem; }

/* ---------------- what-if ---------------- */
.wi-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.wi-result { margin-top: 4px; }
.wi-verdict { border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; margin-bottom: 16px; }
.wi-verdict.ok { background: var(--ok-bg); color: #047857; }
.wi-verdict.bad { background: var(--bad-bg); color: #b91c1c; }
.wi-big { font-weight: 800; font-size: 1.15rem; }
.wi-sub { font-size: .88rem; opacity: .9; }
.wi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.wi-stat {
  background: var(--card-2); border: 1px solid var(--line-2);
  border-radius: 14px; padding: 12px 14px;
  display: flex; flex-direction: column;
}
.wi-stat span { font-size: .74rem; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.wi-stat strong { font-size: 1.15rem; font-weight: 800; }

/* ---------------- modal / low time ---------------- */
.modal {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(25, 20, 49, .45);
  backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; transition: opacity .25s var(--ease);
}
.modal.open { opacity: 1; }
.modal-card {
  width: 100%; max-width: 520px;
  border-radius: 28px 28px 0 0;
  margin: 0;
  transform: translateY(30px);
  transition: transform .35s var(--spring);
}
.modal.open .modal-card { transform: none; }
.modal-head { display: flex; align-items: center; justify-content: space-between; }
.modal-head h3 { margin: 0; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
.modal-head h3 svg { width: 20px; height: 20px; color: var(--brand-2); }
.modal-card .sub { margin-top: 6px; font-size: .9rem; }
.low-input { display: flex; gap: 10px; margin: 18px 0; }
.low-input input { flex: 1; }
.low-title { font-weight: 800; font-size: .86rem; margin: 14px 0 10px; }
#lowDone { margin-top: 8px; }

/* ---------------- toasts ---------------- */
.toast-root { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px;
  background: var(--ink); color: #fff;
  padding: 12px 18px; border-radius: 99px;
  font-weight: 600; font-size: .88rem;
  box-shadow: 0 14px 34px -12px rgba(0,0,0,.4);
  opacity: 0; transform: translateY(12px) scale(.95);
  transition: all .35s var(--spring);
}
.toast.show { opacity: 1; transform: none; }
.toast-ic { width: 22px; height: 22px; border-radius: 99px; background: var(--ok); display: grid; place-items: center; }
.toast-ic svg { width: 13px; height: 13px; }
.toast.bad .toast-ic { background: var(--bad); }

/* ---------------- footer ---------------- */
.footer {
  margin-top: 44px; padding: 20px 4px 6px;
  border-top: 1px solid var(--line);
  text-align: center; color: var(--ink-3);
  font-size: .8rem; line-height: 1.6;
}
.footer p { margin: 0; }
.footer a { color: var(--brand); font-weight: 700; text-decoration: none; transition: color .2s var(--ease); }
.footer a:hover { text-decoration: underline; }
.heart { color: var(--accent); }

/* ---------------- responsive ---------------- */
@media (min-width: 760px) {
  .modal-card { border-radius: 28px; margin-bottom: 30px; }
}
@media (max-width: 860px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .balance-grid { grid-template-columns: 1fr 1fr; }
  .wiz-grid { grid-template-columns: 1fr; }
  .wiz-side { position: static; }
  .today-layout { grid-template-columns: 1fr; }

  .dash-grid { grid-template-columns: 1fr; }

  .topnav { display: none; }

  .ch-name { grid-column: 1 / -1; }

  .ws-day { padding: 8px 2px; }
  .ws-date { display: none; }
  .field-grid { grid-template-columns: 1fr; }
  .field-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .phase-card { flex-direction: column; align-items: flex-start; }
  .phase-right { width: 100%; min-width: 0; }
  .phase-pct { text-align: left; }
  .wi-grid { grid-template-columns: 1fr; }
  .toast-root { bottom: 100px; }
  .stat-grid.small { grid-template-columns: repeat(3, 1fr); }
  .stat-card { padding: 18px; }
  .stat-num { font-size: 1.7rem; }
}
@media (max-width: 430px) {
  .stat-grid { gap: 10px; }
  .stat-card { padding: 16px; }
  .stat-ic { top: 12px; right: 12px; width: 32px; height: 32px; }
  .stat-num { font-size: 1.5rem; }

  .page-head.row { flex-direction: column; }
  .page-head.row .status-tag { align-self: flex-start; }

/* ---------------- reduced motion ---------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;

    transition-duration: .01ms !important;

  }

<script>
/* ============================================================
   utils.js - date + formatting helpers (vanilla, no deps)
   ============================================================ */
(function (global) {
  'use strict';

  const DOW = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const DOW_LABEL = { sun: 'Sun', mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat' };
  const MONTH_LABEL = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function pad(n) { return String(n).padStart(2, '0'); }

  function dstr(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function parse(s) {
    const p = String(s).split('-').map(Number);
    return new Date(p[0], (p[1] || 1) - 1, p[2] || 1);
  }

  function addDays(s, n) {
    const d = parse(s);
    d.setDate(d.getDate() + n);
    return dstr(d);
  }

  function diffDays(a, b) {
    return Math.round((parse(b) - parse(a)) / 86400000);
  }

  function dowKey(s) { return DOW[parse(s).getDay()]; }

  function todayStr() { return dstr(new Date()); }

  function isPast(s) { return s < todayStr(); }

  function startOfWeek(s) {
    const d = parse(s);
    const back = (d.getDay() + 6) % 7; // Monday = 0
    d.setDate(d.getDate() - back);
    return dstr(d);
  }

  function formatShort(s) {
    const d = parse(s);
    return DOW_LABEL[dowKey(s)] + ', ' + d.getDate() + ' ' + MONTH_LABEL[d.getMonth()];
  }

  function formatLong(s) {
    const d = parse(s);
    return DOW_LABEL[dowKey(s)] + ', ' + MONTH_LABEL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  function formatDay(s) {
    const d = parse(s);
    return String(d.getDate()).padStart(2, '0') + ' ' + MONTH_LABEL[d.getMonth()];
  }

  function formatWeekday(s) { return DOW_LABEL[dowKey(s)]; }

  function fmtHours(minutes) {
    minutes = Math.round(minutes || 0);
    if (minutes <= 0) return '0 min';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) return m + ' min';
    if (m === 0) return h + ' h';
    return h + 'h ' + m + 'm';
  }

  function fmtHoursDecimal(minutes) {
    return Math.round((minutes || 0) / 6) / 10;
  }

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  function clamp(n, lo, hi) {
    return Math.max(lo, Math.min(hi, n));
  }

  global.Utils = {
    DOW, DOW_LABEL, MONTH_LABEL,
    dstr, parse, addDays, diffDays, dowKey, todayStr, isPast,
    startOfWeek, formatShort, formatLong, formatDay, formatWeekday,
    fmtHours, fmtHoursDecimal, uid, clamp
  };
})(window);

</script>
<script>
/* ============================================================
   storage.js - persistence layer.

   v1: browser localStorage.
   Later: swap load/save to read/write from Firebase Auth +
   Firestore without touching app.js. Keep the same API surface:
     Store.load()  -> state object
     Store.save(s) -> void
     Store.reset() -> state object (fresh)
   ============================================================ */
(function (global) {
  'use strict';

  const KEY = 'studyplanner.v1';

  function freshState() {
    return {
      version: 1,
      config: {
        examDate: '',
        startDate: '',
        weekdayHours: 2,
        saturdayHours: 5,
        sundayHours: 4,
        preferredDays: ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'],
        revisionRounds: 2,
        bufferDays: 5,
        mockHours: 12
      },
      modules: [],
      plan: {},              // { 'YYYY-MM-DD': [ {task} ] }
      progress: { done: [] }, // array of task ids marked complete
      builtAt: null
    };
  }

  function normalize(s) {
    const fresh = freshState();
    if (!s || typeof s !== 'object') return fresh;
    s.config = Object.assign({}, fresh.config, s.config || {});
    s.modules = Array.isArray(s.modules) ? s.modules : [];
    s.plan = s.plan && typeof s.plan === 'object' ? s.plan : {};
    s.progress = s.progress && typeof s.progress === 'object' ? s.progress : { done: [] };
    if (!Array.isArray(s.progress.done)) s.progress.done = [];
    return s;
  }

  const Store = {
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        return raw ? normalize(JSON.parse(raw)) : freshState();
      } catch (e) {
        return freshState();
      }
    },
    save(state) {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        return false;
      }
    },
    reset() {
      try { localStorage.removeItem(KEY); } catch (e) {}
      return freshState();
    }
  };

  global.Store = Store;
})(window);

</script>
<script>
/* ============================================================
   planner.js - the brains. Pure-ish logic, no DOM.

   Pipeline:
     buildAvailability(config)  -> study days + total time
     computeWorkload(config, modules) -> needed vs available + status
     buildPlan(state)           -> phases, tasks, per-day schedule
     redistribute(state)        -> move missed work to future days
     computeMetrics(state)      -> progress numbers for dashboards
     whatIf(config, modules, tweaks) -> sensitivity analysis

   NOTE: minutes are the currency everywhere. Difficulty gives hard
   chapters more weight; priority only affects ordering, not totals.
   ============================================================ */
(function (global) {
  'use strict';
  const U = global.Utils;

  const DIFF_MULT = { easy: 1.0, medium: 1.2, hard: 1.4 };
  const REV_FACTOR = 0.45;          // a revision pass = 45% of first-study time
  const MCQ_FACTOR = 0.08;          // MCQ bank ≈ 8% of first-study time
  const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };
  const PHASE_LABEL = { 1: 'Phase 1 · First completion', 2: 'Phase 2 · Revision', 3: 'Phase 3 · Final sprint' };

  function chapterMinutes(ch) {
    return Math.round((ch.minutes || 0) * (DIFF_MULT[ch.difficulty] || 1));
  }

  function totalFirstStudy(modules) {
    let t = 0;
    (modules || []).forEach(m => (m.chapters || []).forEach(c => { t += chapterMinutes(c); }));
    return t;
  }

  function totalChapters(modules) {
    return (modules || []).reduce((s, m) => s + (m.chapters || []).length, 0);
  }

  /* ----------------------------------------------------------
     Day availability
     ---------------------------------------------------------- */
  function buildAvailability(config) {
    const studyDays = [];
    const bufferDays = [];
    const bufferStart = U.addDays(config.examDate, -(config.bufferDays || 0));
    let cursor = config.startDate;
    let idx = 0;
    while (cursor < config.examDate) {
      const dow = U.dowKey(cursor);
      const inBuffer = cursor >= bufferStart;
      if (inBuffer) {
        const hours = dayHours(config, dow);
        if (hours > 0) bufferDays.push({ date: cursor, dow, hours, minutes: hours * 60 });
      } else if ((config.preferredDays || []).indexOf(dow) !== -1) {
        const hours = dayHours(config, dow);
        if (hours > 0) studyDays.push({ date: cursor, dow, hours, minutes: hours * 60, idx: idx++ });
      }
      cursor = U.addDays(cursor, 1);
    }
    const totalMinutes = studyDays.reduce((s, d) => s + d.minutes, 0);
    const bufferMinutes = bufferDays.reduce((s, d) => s + d.minutes, 0);
    return { studyDays, bufferDays, totalMinutes, bufferMinutes, count: studyDays.length };
  }

  function dayHours(config, dow) {
    if (dow === 'sat') return config.saturdayHours || 0;
    if (dow === 'sun') return config.sundayHours || 0;
    return config.weekdayHours || 0;
  }

  /* ----------------------------------------------------------
     Workload analysis
     ---------------------------------------------------------- */
  function computeWorkload(config, modules) {
    const firstStudy = totalFirstStudy(modules);
    const rounds = Math.max(1, config.revisionRounds || 1);
    const revision = Math.round(firstStudy * REV_FACTOR * rounds);
    const mcq = Math.max(240, Math.round(firstStudy * MCQ_FACTOR));
    const mock = (config.mockHours || 0) * 60;
    const needed = firstStudy + revision + mcq + mock;
    const avail = buildAvailability(config).totalMinutes;
    const coverage = avail > 0 ? (avail - needed) / avail : -1;

    let status;
    if (coverage >= 0.15) status = 'comfortable';
    else if (coverage >= 0.05) status = 'ontrack';
    else if (coverage >= 0) status = 'tight';
    else status = 'atrisk';

    return {
      firstStudy, revision, mcq, mock, needed, available: avail,
      coverage, status, rounds,
      requiredHoursPerWeek: (needed / 60) / Math.max(0.5, U.diffDays(config.startDate, config.examDate) / 7),
      bufferHoursAfter: Math.max(0, avail - needed) / 60
    };
  }

  /* ----------------------------------------------------------
     Plan builder
     ---------------------------------------------------------- */
  function buildPlan(state) {
    const cfg = state.config;
    const w = computeWorkload(cfg, state.modules);
    const avail = buildAvailability(cfg);
    const days = avail.studyDays;
    const n = days.length;

    if (n === 0) return {};

    // --- phase day split (proportional to hours) -----------------
    const rounds = Math.max(1, cfg.revisionRounds || 1);
    const p1 = w.firstStudy;
    const p2 = Math.max(1, w.firstStudy * REV_FACTOR * (rounds - 1));
    const p3 = Math.max(1, w.firstStudy * REV_FACTOR + w.mcq + w.mock);
    const totalP = p1 + p2 + p3;

    let d1 = Math.round(n * p1 / totalP);
    let d2 = Math.round(n * p2 / totalP);
    if (n >= 3) {
      if (d1 < 1) d1 = 1;
      if (d2 < 1) d2 = 1;
      if (n - d1 - d2 < 1) { d2 = n - d1 - 1; if (d2 < 1) { d2 = 1; } }
    } else {
      d1 = n; d2 = 0;
    }
    const d3 = n - d1 - d2;
    const phaseDays = { 1: days.slice(0, d1), 2: days.slice(d1, d1 + d2), 3: days.slice(d1 + d2) };

    // --- task pools -------------------------------------------------
    const scale = Math.min(1, w.available / Math.max(1, w.needed));
    const pool = { 1: [], 2: [], 3: [] };

    (state.modules || []).forEach(m => {
      (m.chapters || []).forEach(ch => {
        const mins = Math.max(30, Math.round(chapterMinutes(ch) * scale));
        const study = Math.round(mins * 0.55);
        pool[1].push(mkItem('study', m.name, ch.name, 'Concept Study', study, ch.priority, ch.difficulty));
        pool[1].push(mkItem('study', m.name, ch.name, 'Practice Questions', mins - study, ch.priority, ch.difficulty));
        for (let r = 1; r <= rounds; r++) {
          const rev = Math.max(15, Math.round(mins * REV_FACTOR));
          const target = r === rounds ? 3 : 2;
          pool[target].push(mkItem('revision', m.name, ch.name, 'Revision R' + r + ' · ' + ch.name, rev, ch.priority, ch.difficulty));
        }
      });
    });

    const mockCount = Math.max(1, Math.round((cfg.mockHours || 0) / 3));
    for (let i = 1; i <= mockCount; i++) {
      pool[3].push(mkItem('mock', 'Mock Test', '', 'Mock test ' + i, Math.round((cfg.mockHours || 0) * 60 / mockCount), 'high', 'hard'));
    }

    pool[1].sort(byOrder);
    pool[2].sort(byOrder);
    pool[3].sort(byOrder);

    const mcqLeft = { v: w.mcq * scale };
    const revLeft = { v: w.revision * scale };

    const plan = {};
    let seq = 0;
    let keyMap = collectDoneKeys(state.plan, state.progress.done);

    for (let ph = 1; ph <= 3; ph++) {
      const phDays = phaseDays[ph];
      let pi = 0;
      for (let di = 0; di < phDays.length; di++) {
        const day = phDays[di];
        let rem = day.minutes;
        const entries = [];
        while (pi < pool[ph].length && rem >= 10) {
          const t = pool[ph][pi];
          const take = Math.min(t.minutes, rem);
          entries.push(mkTask(day.date, ph, t, take, seq++, keyMap));
          t.minutes -= take;
          rem -= take;
          if (t.minutes <= 0) pi++;
          if (rem < 10) break;
        }
        if (rem >= 10 && mcqLeft.v >= 10) {
          entries.push(mkTask(day.date, ph, mkItem('mcq', '', '', 'MCQs', 10, 'low', 'easy'), 10, seq++, keyMap));
          rem -= 10; mcqLeft.v -= 10;
        }
        if (rem >= 15 && revLeft.v >= 15) {
          const title = ph === 3 ? 'Quick recall & formula sheet' : 'Previous topic revision';
          entries.push(mkTask(day.date, ph, mkItem('revision', '', '', title, 15, 'medium', 'easy'), 15, seq++, keyMap));
          rem -= 15; revLeft.v -= 15;
        }
        if (entries.length) plan[day.date] = entries;
      }
    }

    return plan;
  }

  function mkItem(type, module, chapter, title, minutes, priority, difficulty) {
    return { type, module, chapter, title, minutes, priority, difficulty };
  }

  function byOrder(a, b) {
    const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if (p) return p;
    const d = DIFF_MULT[b.difficulty] - DIFF_MULT[a.difficulty];
    return d;
  }

  function taskKey(t) {
    return t.phase + '|' + t.type + '|' + t.module + '|' + t.chapter + '|' + t.title;
  }

  function collectDoneKeys(plan, doneIds) {
    const keys = new Set();
    const idSet = new Set(doneIds || []);
    Object.keys(plan || {}).forEach(date =>
      (plan[date] || []).forEach(t => {
        if (idSet.has(t.id)) keys.add(taskKey(t));
      })
    );
    return keys;
  }

  function mkTask(date, phase, t, minutes, seq, doneKeys) {
    return {
      id: 't' + seq,
      key: phase + '|' + t.type + '|' + t.module + '|' + t.chapter + '|' + t.title,
      date,
      phase,
      type: t.type,
      module: t.module,
      chapter: t.chapter,
      title: t.title,
      minutes,
      priority: t.priority,
      done: doneKeys.has(phase + '|' + t.type + '|' + t.module + '|' + t.chapter + '|' + t.title)
    };
  }

  /* ----------------------------------------------------------
     Redistribution - never fails the plan, never exceeds the cap
     ---------------------------------------------------------- */
  function redistribute(state) {
    const cfg = state.config;
    const today = U.todayStr();
    const futureDays = buildAvailability(cfg).studyDays.filter(d => d.date >= today);
    const capacity = {};
    futureDays.forEach(d => {
      let used = 0;
      (state.plan[d.date] || []).forEach(t => { used += t.minutes; });
      capacity[d.date] = d.minutes - used;
    });

    let moved = 0;
    const pendingDates = Object.keys(state.plan || {}).filter(d => d < today);
    pendingDates.sort();

    pendingDates.forEach(date => {
      const dayTasks = state.plan[date] || [];
      const pending = dayTasks.filter(t => !t.done);
      pending.forEach(t => {
        let target = null;
        for (let i = 0; i < futureDays.length; i++) {
          const d = futureDays[i].date;
          if ((capacity[d] || 0) >= t.minutes) { target = d; break; }
        }
        if (target) {
          const task = Object.assign({}, t, { date: target });
          if (!state.plan[target]) state.plan[target] = [];
          state.plan[target].push(task);
          capacity[target] -= t.minutes;
          moved++;
        }
      });
      dayTasks.splice(0, dayTasks.length, ...dayTasks.filter(t => t.done));
      if (!dayTasks.length) delete state.plan[date];
    });

    // tidy: keep date keys sorted
    return moved;
  }

  /* ----------------------------------------------------------
     Metrics
     ---------------------------------------------------------- */
  function computeMetrics(state) {
    const plan = state.plan || {};
    const doneSet = new Set((state.progress && state.progress.done) || []);
    const today = U.todayStr();
    const m = { planned: { study: 0, revision: 0, mcq: 0, mock: 0 }, done: { study: 0, revision: 0, mcq: 0, mock: 0 } };
    const chapterMap = {};
    let plannedTotal = 0, doneTotal = 0;

    // weekly window (Mon..Sun containing today)
    const mon = U.startOfWeek(today);
    const week = { planned: 0, done: 0, tasks: 0, doneTasks: 0 };

    Object.keys(plan).forEach(date => {
      (plan[date] || []).forEach(t => {
        const isDone = doneSet.has(t.id) || t.done;
        m.planned[t.type] += t.minutes;
        if (isDone) m.done[t.type] += t.minutes;
        if (t.type === 'study') {
          plannedTotal += t.minutes;
          if (isDone) doneTotal += t.minutes;
          const ck = t.module + '|' + t.chapter;
          if (!chapterMap[ck]) chapterMap[ck] = { planned: 0, done: 0 };
          chapterMap[ck].planned += t.minutes;
          if (isDone) chapterMap[ck].done += t.minutes;
        }
        if (date >= mon && date <= U.addDays(mon, 6)) {
          week.planned += t.minutes;
          if (isDone) week.done += t.minutes;
          week.tasks++;
          if (isDone) week.doneTasks++;
        }
      });
    });

    let chaptersDone = 0;
    Object.keys(chapterMap).forEach(k => {
      if (chapterMap[k].done >= chapterMap[k].planned - 0.5) chaptersDone++;
    });

    const totalPlanned = Object.keys(m.planned).reduce((s, k) => s + m.planned[k], 0);
    const totalDone = Object.keys(m.done).reduce((s, k) => s + m.done[k], 0);

    return {
      planned: m.planned, done: m.done,
      syllabusPct: plannedTotal ? Math.min(100, (doneTotal / plannedTotal) * 100) : 0,
      firstStudyPct: m.planned.study ? (m.done.study / m.planned.study) * 100 : 0,
      revisionPct: m.planned.revision ? (m.done.revision / m.planned.revision) * 100 : 0,
      mcqPct: m.planned.mcq ? (m.done.mcq / m.planned.mcq) * 100 : 0,
      mockPct: m.planned.mock ? (m.done.mock / m.planned.mock) * 100 : 0,
      chaptersTotal: Object.keys(chapterMap).length,
      chaptersDone,
      chaptersLeft: Object.keys(chapterMap).length - chaptersDone,
      week,
      weekPct: week.planned ? (week.done / week.planned) * 100 : 0,
      totalPlanned, totalDone
    };
  }

  /* ----------------------------------------------------------
     What-if
     ---------------------------------------------------------- */
  function whatIf(config, modules, tweaks) {
    const cfg = Object.assign({}, config);
    if (tweaks.weekdayHours != null) cfg.weekdayHours = tweaks.weekdayHours;
    if (tweaks.saturdayHours != null) cfg.saturdayHours = tweaks.saturdayHours;
    if (tweaks.sundayHours != null) cfg.sundayHours = tweaks.sundayHours;
    const w = computeWorkload(cfg, modules);
    const canFinish = w.coverage >= 0;
    return {
      canFinish,
      deficitHours: Math.max(0, w.needed - w.available) / 60,
      bufferHoursAfter: w.bufferHoursAfter,
      requiredHoursPerWeek: w.requiredHoursPerWeek,
      status: w.status,
      coverage: w.coverage,
      availableHours: w.available / 60
    };
  }

  global.Planner = {
    DIFF_MULT, REV_FACTOR, MCQ_FACTOR, PHASE_LABEL,
    chapterMinutes, totalFirstStudy, totalChapters,
    buildAvailability, computeWorkload, buildPlan, redistribute,
    computeMetrics, whatIf
  };
})(window);

</script>
<script>
/* ============================================================
   app.js - UI layer. Views: setup wizard, dashboard, today,
   plan, syllabus, what-if. Delegated events, localStorage via

   ============================================================ */
(function () {

  const S = Store.load();

  let wizard = null;      // active wizard state when editing
  let wiTimer = null;

  function save() { Store.save(S); }

  /* ------------------------------------------------------------

  const IC = {

    flame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 4.5 5 9.5A5 5 0 0 1 7 11.5C7 7 12 2 12 2z"/><path d="M12 22a5 5 0 0 1-5-5c0-2.2 2.6-5 5-7 2.4 2 5 4.8 5 7a5 5 0 0 1-5 5z"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
    power: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v7M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>'
  };
  function icon(name) { return IC[name] || ''; }

  /* ------------------------------------------------------------
     micro helpers
     ------------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  const STATUS = {
    comfortable: { label: 'Comfortable', cls: 'st-ok', msg: 'You have room to breathe. Keep the pace.' },
    ontrack: { label: 'On Track', cls: 'st-ok', msg: 'Steady wins the race. Stay consistent.' },
    tight: { label: 'Tight', cls: 'st-warn', msg: 'It fits - but protect your study windows.' },
    atrisk: { label: 'At Risk', cls: 'st-bad', msg: "Let's catch up. Add hours or trim scope." }
  };

  function statusTag(status, big) {
    const s = STATUS[status] || STATUS.ontrack;
    return `<div class="status-tag ${s.cls}${big ? ' big' : ''}">
      <span class="status-ic">${icon(s.icon || 'flame')}</span>
      <div class="status-txt">
        <strong>${s.label}</strong>
        ${s.msg ? `<small>${s.msg}</small>` : ''}
      </div>
    </div>`;
  }

  function bar(pct, cls) {
    return `<div class="bar"><div class="bar-fill ${cls || ''}" data-fill="${Math.max(0, Math.min(100, pct))}"></div></div>`;
  }

  function chip(label, cls) {
    return `<span class="chip ${cls || ''}">${esc(label)}</span>`;
  }

  function toast(msg, cls) {
    const root = $('#toastRoot');
    const t = document.createElement('div');
    t.className = 'toast ' + (cls || 'ok');
    t.innerHTML = `<span class="toast-ic">${icon(cls === 'bad' ? 'bolt' : 'check')}</span><span>${esc(msg)}</span>`;
    root.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2600);
  }

  function animateCounts(root) {
    $$('.count', root).forEach(el => {
      const target = parseFloat(el.getAttribute('data-target'));
      if (isNaN(target)) return;
      const dur = 750;
      const t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        el.textContent = Math.round(target * eased).toString();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  function animateBars(root) {
    $$('[data-fill]', root).forEach(el => {
      const w = el.getAttribute('data-fill');
      requestAnimationFrame(() => { el.style.width = w + '%'; });
    });
  }

  function reveal(root) {
    $$('.reveal', root).forEach((el, i) => {
      el.style.animationDelay = (i * 55) + 'ms';
      el.classList.add('in');
    });
  }

  /* ------------------------------------------------------------
     router
     ------------------------------------------------------------ */
  function navigate(v) {
    view = v;
    try { location.hash = v; } catch (e) {}
    render();
  }

  function render() {
    const hasPlan = !!(S.config && S.config.examDate && S.config.startDate);
    document.body.classList.toggle('setup-mode', !hasPlan);
    $('#topnav').style.display = hasPlan ? '' : 'none';
    $('#bottomnav').style.display = hasPlan ? '' : 'none';
    $('#editBtn').style.display = hasPlan ? '' : 'none';
    $('#brandBtn').style.display = hasPlan ? '' : 'none';

    $$('#topnav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    $$('#bottomnav button').forEach(b => b.classList.toggle('active', b.dataset.view === view));

    const root = $('#view');
    if (!hasPlan) { renderWizard(root); return; }
    switch (view) {
      case 'today': renderToday(root); break;
      case 'plan': renderPlan(root); break;
      case 'syllabus': renderSyllabus(root); break;
      case 'whatif': renderWhatIf(root); break;
      default: renderDashboard(root); break;
    }
  }

  /* ------------------------------------------------------------
     WIZARD
     ------------------------------------------------------------ */
  function wizardState() {
    return JSON.parse(JSON.stringify({
      cfg: S.config,
      modules: S.modules,
      step: 1
    }));
  }

  function wizNumbers(w) {
    const c = w.cfg;
    const avail = (c.examDate && c.startDate && c.startDate < c.examDate) ? P.buildAvailability(c) : null;
    const days = c.examDate && c.startDate ? U.diffDays(c.startDate, c.examDate) : 0;
    const workload = (c.examDate && c.startDate && c.startDate < c.examDate && w.modules.length) ? P.computeWorkload(c, w.modules) : null;
    return { c, avail, days, weeks: (days / 7).toFixed(1), months: (days / 30.4).toFixed(1), workload };
  }

  function wizSideHTML(w, buttons) {
    const { c, avail, days, weeks, months, workload } = wizNumbers(w);
    const hours = avail ? Math.round(avail.totalMinutes / 60) : 0;
    return `
    <div class="wiz-side reveal">
      <div class="live-card card">
        <p class="card-label">Live preview</p>
        <div class="live-row"><span>Your countdown</span><strong>${c.examDate ? Math.max(0, days) + ' days' : '-'}</strong></div>
        <div class="live-row"><span>Weeks remaining</span><strong>${c.examDate ? weeks : '-'}</strong></div>
        <div class="live-row"><span>Months remaining</span><strong>${c.examDate ? months : '-'}</strong></div>
        <div class="live-row live-hot"><span>Time you've got</span><strong>${hours ? hours + ' h' : '-'}</strong></div>
        ${workload ? `<div class="live-verdict">${statusTag(workload.status)}</div>` : ''}
        ${buttons || ''}
      </div>
    </div>`;
  }

  function refreshWizardSide() {
    if (!wizard) return;
    const w = wizard;
    const buttons = w.step === 1
      ? `<button class="btn primary wide" id="wizNext">Continue ${icon('arrow')}</button>`
      : `<button class="btn primary wide" id="wizBuild" ${w.modules.length && P.totalChapters(w.modules) ? '' : 'disabled'}>Build my plan ${icon('arrow')}</button>
         <button class="btn ghost wide" data-action="wiz-back">← Back</button>`;
    const side = $('#view .wiz-side');
    if (side) { side.outerHTML = wizSideHTML(w, buttons); reveal($('#view')); }
  }

  function renderWizard(root) {
    if (!wizard) wizard = wizardState();
    const w = wizard;
    const c = w.cfg;
    const step1 = `
      <section class="page narrow">
        <header class="page-head reveal">
          <p class="eyebrow">Setup · Step 1</p>
          <h1 class="h-xl">Let's get you <span class="grad">exam-ready.</span></h1>
          <p class="sub">Tell me how much time you actually have. I'll do the math.
            <span class="byline">By <a href="https://www.linkedin.com/in/anshulkarwa" target="_blank" rel="noopener">CA Anshul Karwa</a></span>
          </p>
        </header>
        <div class="wiz-grid">
          <div class="wiz-form card reveal">
            <div class="field-grid">
              <div class="field">
                <label for="wExam">Exam date</label>
                <input type="date" id="wExam" data-wiz="examDate" value="${c.examDate}" />
              </div>
              <div class="field">
                <label for="wStart">Study start date</label>
                <input type="date" id="wStart" data-wiz="startDate" value="${c.startDate}" />
              </div>
            </div>
            <div class="field">
              <label>Study hours per day</label>
              <div class="field-grid three">
                <div class="field mini"><label for="wWkd">Weekday</label>
                  <input type="number" id="wWkd" data-wiz="weekdayHours" min="0" max="16" step="0.5" value="${c.weekdayHours}" /></div>
                <div class="field mini"><label for="wSat">Saturday</label>
                  <input type="number" id="wSat" data-wiz="saturdayHours" min="0" max="16" step="0.5" value="${c.saturdayHours}" /></div>
                <div class="field mini"><label for="wSun">Sunday</label>
                  <input type="number" id="wSun" data-wiz="sundayHours" min="0" max="16" step="0.5" value="${c.sundayHours}" /></div>
              </div>
            </div>
            <div class="field">
              <label>Preferred study days</label>
              <div class="chips">
                ${U.DOW.map(key => {
                  const on = c.preferredDays.indexOf(key) !== -1;
                  return `<button type="button" class="chip-btn ${on ? 'on' : ''}" data-day="${key}">${U.DOW_LABEL[key]}</button>`;
                }).join('')}
              </div>
            </div>
            <div class="field-grid">

  function syncWizard() {
    const w = wizard;
    $$('#view [data-wiz]').forEach(el => {
      const key = el.getAttribute('data-wiz');
      if (key === 'moduleName') {
        const mi = +el.closest('.module-editor').getAttribute('data-mi');
        if (w.modules[mi]) w.modules[mi].name = el.value;
      } else if (key === 'chName' || key === 'chDiff' || key === 'chHours' || key === 'chPri') {
        const row = el.closest('.ch-row');
        const mi = +row.closest('.module-editor').getAttribute('data-mi');
        const ci = +row.getAttribute('data-ci');
        const ch = w.modules[mi].chapters[ci];
        if (!ch) return;
        if (key === 'chName') ch.name = el.value;
        if (key === 'chDiff') ch.difficulty = el.value;
        if (key === 'chHours') ch.minutes = Math.round((parseFloat(el.value) || 0) * 60);
        if (key === 'chPri') ch.priority = el.value;
      } else {
        w.cfg[key] = el.type === 'number' ? (parseFloat(el.value) || 0) : el.value;
      }
    });
    $$('#view .chip-btn[data-day]').forEach(b => {
      const key = b.getAttribute('data-day');
      const i = w.cfg.preferredDays.indexOf(key);
      if (b.classList.contains('on') && i === -1) w.cfg.preferredDays.push(key);
      if (!b.classList.contains('on') && i !== -1) w.cfg.preferredDays.splice(i, 1);
    });
  }

  function wizardValid() {
    const c = wizard.cfg;
    return !!(c.examDate && c.startDate && c.startDate < c.examDate && c.preferredDays.length && wizard.modules.length && P.totalChapters(wizard.modules));
  }

  function buildAndGo() {
    syncWizard();
    if (!wizardValid()) { toast('Set your dates and add at least one chapter first', 'bad'); return; }
    S.config = wizard.cfg;
    S.modules = wizard.modules;
    S.plan = P.buildPlan(S);
    S.builtAt = new Date().toISOString();
    save();
    wizard = null;
    navigate('dashboard');

  function buildPhases() {
    const cfg = S.config;
    const w = P.computeWorkload(cfg, S.modules);
    const days = P.buildAvailability(cfg).studyDays;
    if (!days.length) return [];
    const rounds = Math.max(1, cfg.revisionRounds || 1);
    const p1 = w.firstStudy;
    const p2 = Math.max(1, w.firstStudy * P.REV_FACTOR * (rounds - 1));
    const p3 = Math.max(1, w.firstStudy * P.REV_FACTOR + w.mcq + w.mock);
    const totalP = p1 + p2 + p3;
    let d1 = Math.round(days.length * p1 / totalP);
    let d2 = Math.round(days.length * p2 / totalP);
    if (days.length >= 3) {
      if (d1 < 1) d1 = 1;
      if (d2 < 1) d2 = 1;
      if (days.length - d1 - d2 < 1) { d2 = days.length - d1 - 1; if (d2 < 1) d2 = 1; }
    } else { d1 = days.length; d2 = 0; }
    const d3 = days.length - d1 - d2;
    const starts = [days[0].date, days[d1].date, days[d1 + d2].date];
    const ends = [days[d1 - 1].date, days[d1 + d2 - 1].date, days[days.length - 1].date];
    const descs = [
      'Study every chapter for the first time. Concept + practice per topic.',
      'Rotate through the syllabus again. Each pass gets faster.',
      'Final revision, daily MCQs and full mock tests. Cool down before the exam.'
    ];
    return [1, 2, 3].map(i => ({
      n: i, start: starts[i - 1], end: ends[i - 1],
      days: [d1, d2, d3][i - 1],
      desc: descs[i - 1]
    }));
  }

  function phaseCard(ph, i) {
    const m = P.computeMetrics(S);
    const pct = i === 0 ? m.firstStudyPct : i === 1 ? m.revisionPct * (S.config.revisionRounds > 1 ? 0.5 : 1) : Math.min(100, (m.mockPct + m.mcqPct) / 2);
    return `
    <div class="phase-card card">
      <div class="phase-left">
        <div class="phase-dot">${ph.n}</div>
        <div>
          <p class="phase-name">Phase ${ph.n} · ${i === 0 ? 'First completion' : i === 1 ? 'Revision' : 'Final sprint'}</p>
          <p class="phase-sub">${U.formatShort(ph.start)} → ${U.formatShort(ph.end)} · ${ph.days} study days</p>

        ${bar(pct, i === 0 ? 'fill-violet' : i === 1 ? 'fill-ok' : 'fill-pink')}
      </div>
    </div>`;
  }

        ${S.modules.length === 0 ? `<div class="empty card"><span class="empty-ic">${icon('book')}</span><p>No modules yet. Add one to get going.</p></div>` : ''}
        <div class="syl-list">
          ${S.modules.map((mod, mi) => `
            <div class="card module-card reveal">
              <div class="mc-head">
                <span class="mc-name">${esc(mod.name) || 'Untitled module'}</span>
                <div class="mc-actions">
                  <button class="icon-btn" data-action="syl-edit" data-mi="${mi}" title="Edit">${icon('sparkle')}</button>
                  <button class="icon-btn danger" data-action="syl-del" data-mi="${mi}" title="Delete">${icon('trash')}</button>
                </div>
              </div>
              <div class="mc-stats">
                <span>${(mod.chapters || []).length} chapters</span>
                <span>${U.fmtHours((mod.chapters || []).reduce((s, c) => s + P.chapterMinutes(c), 0))}</span>
              </div>
            </div>`).join('')}
        </div>
      </section>`;

    reveal(root); animateCounts(root);
  }

  function editModuleModal(mi) {
    wizard = JSON.parse(JSON.stringify({ cfg: S.config, modules: S.modules, step: 2 }));
    renderWizard($('#view'));
    setTimeout(() => {
      const ed = $('#view .module-editor[data-mi="' + mi + '"]');
      if (ed) { ed.scrollIntoView({ behavior: 'smooth', block: 'center' }); ed.classList.add('flash'); }
    }, 60);
  }

  /* ------------------------------------------------------------
     WHAT-IF
     ------------------------------------------------------------ */
  function runWhatIfHTML(tw, sa, su) {
    const r = P.whatIf(S.config, S.modules, { weekdayHours: tw, saturdayHours: sa, sundayHours: su });
    const base = P.computeWorkload(S.config, S.modules).requiredHoursPerWeek;
    return `
      <div class="wi-result card">
        <div class="wi-verdict ${r.canFinish ? 'ok' : 'bad'}">
          <span class="wi-big">${r.canFinish ? 'You can finish.' : 'Not with this.'}</span>
          <span class="wi-sub">${r.canFinish ? 'Syllabus fits within your time.' : 'Short by ' + U.fmtHours(Math.round(r.deficitHours * 60)) + '.'}</span>
        </div>
        <div class="wi-grid">
          <div class="wi-stat"><span>Buffer left</span><strong>${Math.round(r.bufferHoursAfter)}h</strong></div>
          <div class="wi-stat"><span>Hours / week needed</span><strong>${r.requiredHoursPerWeek.toFixed(1)}h</strong></div>
          <div class="wi-stat"><span>Available time</span><strong>${Math.round(r.availableHours)}h</strong></div>
        </div>
        <p class="hint">Currently planning ${base.toFixed(1)}h/week. ${r.requiredHoursPerWeek <= base ? 'You\'d keep your pace.' : 'You\'d need to push to ' + r.requiredHoursPerWeek.toFixed(1) + 'h/week.'}</p>
      </div>`;
  }

  function renderWhatIf(root) {
    const c = S.config;
    root.innerHTML = `
      <section class="page narrow">
        <header class="page-head reveal">
          <p class="eyebrow">What-if</p>
          <h1 class="h-xl">What if life <span class="grad">changes?</span></h1>
          <p class="sub">Slide your hours and see if the plan still holds.</p>
        </header>
        <div class="card reveal">
          <p class="card-label">How many hours can you really give?</p>
          <div class="field-grid three">
            <div class="field mini"><label>Weekday</label><input type="number" id="wiWkd" min="0" max="16" step="0.5" value="${c.weekdayHours}" /></div>
            <div class="field mini"><label>Saturday</label><input type="number" id="wiSat" min="0" max="16" step="0.5" value="${c.saturdayHours}" /></div>
            <div class="field mini"><label>Sunday</label><input type="number" id="wiSun" min="0" max="16" step="0.5" value="${c.sundayHours}" /></div>
          </div>
          <div class="wi-chips">
            ${[[0.75, '-25%'], [1, 'Current'], [1.25, '+25%'], [1.5, '+50%']].map(([mult, label]) =>
              `<button class="chip-btn ${mult === 1 ? 'on' : ''}" data-wi-mult="${mult}">${label}</button>`).join('')}
          </div>
          <div id="wiOut">${runWhatIfHTML(c.weekdayHours, c.saturdayHours, c.sundayHours)}</div>
        </div>
      </section>`;
    reveal(root); animateBars(root);
  }

  function refreshWhatIf() {
    const out = $('#wiOut');
    if (!out) return;
    const wkd = parseFloat($('#wiWkd').value) || 0;
    const sat = parseFloat($('#wiSat').value) || 0;
    const sun = parseFloat($('#wiSun').value) || 0;
    out.innerHTML = runWhatIfHTML(wkd, sat, sun);
    animateBars(out);
  }

  /* ------------------------------------------------------------
     EVENTS (delegated)
     ------------------------------------------------------------ */
  function setupEvents() {
    $('#topnav').addEventListener('click', onNav);
    $('#bottomnav').addEventListener('click', onNav);
    $('#brandBtn').addEventListener('click', () => navigate('dashboard'));

    $('#editBtn').addEventListener('click', () => {
      wizard = null;
      renderWizard($('#view'));
    });

    $('#view').addEventListener('click', onClick);
    $('#view').addEventListener('input', onInput);
    $('#view').addEventListener('change', onChange);
    window.addEventListener('hashchange', onHash);
  }

  function onHash() {
    const h = (location.hash || '').replace('#', '');
    if (['dashboard', 'today', 'plan', 'syllabus', 'whatif'].indexOf(h) !== -1 && hasPlanReady() && h !== view) {
      view = h; render();
    }
  }

  function hasPlanReady() { return !!(S.config && S.config.examDate); }

  function onNav(e) {
    const b = e.target.closest('[data-view]');
    if (b) navigate(b.getAttribute('data-view'));
  }

  function onClick(e) {
    const t = e.target;
    const nav = t.closest('[data-view]');
    if (nav) { navigate(nav.getAttribute('data-view')); return; }

    const step = t.closest('[data-wiz-step]');
    if (step) {
      if (!wizard) return;
      const key = step.getAttribute('data-key');
      const d = parseInt(step.getAttribute('data-wiz-step'), 10);
      wizard.cfg[key] = Math.max(0, (wizard.cfg[key] || 0) + d);
      renderWizard($('#view'));
      return;
    }

    const day = t.closest('.chip-btn[data-day]');
    if (day) {
      day.classList.toggle('on');
      if (wizard) { syncWizard(); refreshWizardSide(); }
      return;
    }

    const wi = t.closest('[data-wi-mult]');
    if (wi) {
      const mult = parseFloat(wi.getAttribute('data-wi-mult'));
      $('#wiWkd').value = Math.round(S.config.weekdayHours * mult * 10) / 10;
      $('#wiSat').value = Math.round(S.config.saturdayHours * mult * 10) / 10;
      $('#wiSun').value = Math.round(S.config.sundayHours * mult * 10) / 10;
      $$('#view .wi-chips .chip-btn').forEach(x => x.classList.remove('on'));
      wi.classList.add('on');
      refreshWhatIf();
      return;
    }

    const wizNext = t.closest('#wizNext');
    if (wizNext) {
      syncWizard();
      const c = wizard.cfg;
      if (!c.examDate || !c.startDate || c.startDate >= c.examDate) { toast('Set the exam date after the start date', 'bad'); return; }
      if (!c.preferredDays.length) { toast('Pick at least one study day', 'bad'); return; }
      wizard.step = 2;
      renderWizard($('#view'));
      return;
    }

    const wizBuild = t.closest('#wizBuild');
    if (wizBuild) { buildAndGo(); return; }

    const actEl = t.closest('[data-action]');
    if (actEl) { handleAction(actEl.getAttribute('data-action'), actEl); return; }
  }

  function handleAction(action, el) {
    switch (action) {
      case 'toggle': {
        const id = el.getAttribute('data-id');
        const date = findTaskDate(id);
        if (!date) return;
        const task = (S.plan[date] || []).find(x => x.id === id);
        if (!task) return;
        task.done = !task.done;
        const i = S.progress.done.indexOf(id);
        if (task.done) {
          if (i === -1) S.progress.done.push(id);
          el.classList.add('pop');
        } else if (i !== -1) S.progress.done.splice(i, 1);
        save();
        setTimeout(() => render(), 200);
        if (task.done) toast(task.type === 'mock' ? 'Mock banked. Nice.' : 'Task done. Stacking up.');
        break;
      }
      case 'goto-today': navigate('today'); break;
      case 'catchup': {
        const moved = P.redistribute(S);
        save();
        toast(moved ? moved + ' task' + (moved > 1 ? 's' : '') + ' moved to future free days' : 'Nothing to shuffle');
        render();
        break;
      }
      case 'lowtime': openLowTime(); break;
      case 'wiz-add-module':
        if (wizard) { syncWizard(); wizard.modules.push({ id: U.uid('m'), name: '', chapters: [] }); renderWizard($('#view')); }
        break;
      case 'wiz-del-module': {
        if (!wizard) break;
        const mi = +el.getAttribute('data-mi');
        syncWizard();
        wizard.modules.splice(mi, 1);
        renderWizard($('#view'));
        break;
      }
      case 'wiz-add-ch': {
        if (!wizard) break;
        const mi = +el.getAttribute('data-mi');
        syncWizard();
        wizard.modules[mi].chapters.push({ id: U.uid('c'), name: '', difficulty: 'medium', minutes: 120, priority: 'medium' });
        renderWizard($('#view'));
        break;
      }
      case 'wiz-del-ch': {
        if (!wizard) break;
        const mi = +el.getAttribute('data-mi');
        const ci = +el.getAttribute('data-ci');
        syncWizard();
        wizard.modules[mi].chapters.splice(ci, 1);
        renderWizard($('#view'));
        break;
      }
      case 'wiz-back':
        if (wizard) { wizard.step = 1; renderWizard($('#view')); }
        break;
      case 'syl-add-module':
        S.modules.push({ id: U.uid('m'), name: 'New module', chapters: [] });
        save();
        render();
        toast('Module added. Tap the sparkle to fill it in.');
        break;
      case 'syl-edit':
        editModuleModal(+el.getAttribute('data-mi'));
        break;
      case 'syl-del': {
        const mi = +el.getAttribute('data-mi');
        const mod = S.modules[mi];
        if (mod && confirm('Delete "' + (mod.name || 'module') + '" and its chapters?')) {
          S.modules.splice(mi, 1);
          S.plan = P.buildPlan(S);
          save();
          render();
          toast('Module deleted. Plan rebuilt.');
        }
        break;
      }
    }
  }

  function onInput(e) {
    if (wizard && e.target.closest('[data-wiz]')) {
      syncWizard();
      refreshWizardSide();
      return;
    }
    if (e.target.id === 'wiWkd' || e.target.id === 'wiSat' || e.target.id === 'wiSun') {
      clearTimeout(wiTimer);
      wiTimer = setTimeout(refreshWhatIf, 120);
    }
  }

  function onChange(e) {
    if (wizard && e.target.closest('[data-wiz]')) {
      syncWizard();
      refreshWizardSide();
    }
  }

  function findTaskDate(id) {
    for (const date in S.plan) {
      if ((S.plan[date] || []).some(t => t.id === id)) return date;
    }
    return null;
  }

  /* ------------------------------------------------------------
     LOW TIME MODE
     ------------------------------------------------------------ */
  function openLowTime() {
    const today = U.todayStr();
    const pending = (S.plan[today] || []).filter(t => !t.done);
    const overlay = document.createElement('div');
    overlay.className = 'modal';
    overlay.innerHTML = `
      <div class="modal-card card">
        <div class="modal-head">
          <h3>${icon('bolt')} Low on time today?</h3>
          <button class="icon-btn" data-close="1">✕</button>
        </div>
        <p class="sub">Tell me how many minutes you have. I'll pick the highest-value tasks that fit.</p>
        <div class="low-input">
          <input type="number" id="lowMin" min="5" max="720" step="5" placeholder="e.g. 45" />
          <button class="btn primary" id="lowGo">Pick for me</button>
        </div>
        <div id="lowOut"></div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(() => overlay.classList.add('open'));

    const close = () => { overlay.classList.remove('open'); setTimeout(() => overlay.remove(), 250); render(); };
    overlay.addEventListener('click', e => {
      if (e.target === overlay || e.target.closest('[data-close]')) close();
    });

    $('#lowGo', overlay).addEventListener('click', () => {
      const mins = parseFloat($('#lowMin', overlay).value);
      if (!mins || mins < 5) { toast('Enter a number of minutes', 'bad'); return; }
      const PRIO = { high: 0, medium: 1, low: 2 };
      const ranked = pending.slice().sort((a, b) => {
        const pr = (PRIO[a.priority] || 1) - (PRIO[b.priority] || 1);
        if (pr) return pr;
        return b.minutes - a.minutes;
      });
      const chosen = [];
      let left = mins;
      ranked.forEach(t => { if (t.minutes <= left) { chosen.push(t); left -= t.minutes; } });
      if (!chosen.length) {
        $('#lowOut', overlay).innerHTML = `<div class="empty sm"><p>Nothing fits in ${Math.round(mins)} min today. Take a guilt-free break${ranked[0] ? ' - or knock out ' + ranked[0].minutes + ' min of "' + esc(ranked[0].title) + '"' : ''}.</p></div>`;
        return;
      }
      $('#lowOut', overlay).innerHTML = `
        <p class="low-title">Your ${Math.round(mins)}-min hit list:</p>
        ${chosen.map(t => `
          <div class="task" data-action="toggle" data-id="${t.id}">
            <span class="task-check"></span>
            <div class="task-body">
              <p class="task-title">${esc(t.title)}</p>
              ${t.module ? `<p class="task-meta"><span class="tag">${esc(t.module)}${t.chapter ? ' · ' + esc(t.chapter) : ''}</span></p>` : ''}
            </div>
            <div class="task-right"><span class="task-mins">${t.minutes} min</span></div>
          </div>`).join('')}
        <button class="btn ghost wide" id="lowDone">Done for today</button>`;
      overlay.querySelectorAll('.task').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          const task = pending.find(x => x.id === id);
          if (task) {
            task.done = true;
            if (S.progress.done.indexOf(id) === -1) S.progress.done.push(id);
            save();
            el.classList.add('done');
            toast('Banked. Small win today.');
          }
        });
      });
      const doneBtn = $('#lowDone', overlay);
      if (doneBtn) doneBtn.addEventListener('click', close);
    });
  }

  /* ------------------------------------------------------------
     boot
     ------------------------------------------------------------ */
  function boot() {
    P.redistribute(S);
    save();
    setupEvents();
    const h = (location.hash || '').replace('#', '');
    if (['dashboard', 'today', 'plan', 'syllabus', 'whatif'].indexOf(h) !== -1) view = h;
    render();
  }

  boot();
})();

</script>
</body>
</html>
